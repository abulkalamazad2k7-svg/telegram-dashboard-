<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Scan Dashboard</title>
    <!-- Telegram Mini App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #111827;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background-color: #1f2937;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        
        /* ক্যামেরা উইন্ডো ও স্ক্যান এরিয়া */
        .camera-box {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #374151;
            margin-bottom: 20px;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* ফেস স্ক্যানার ফ্রেম ওভারলে */
        .scan-overlay {
            position: absolute;
            width: 180px;
            height: 220px;
            border: 3px dashed #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            display: none;
        }

        /* বাটন স্টাইল */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: #0284c7;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0369a1;
        }
        .btn-success {
            background-color: #16a34a;
            color: white;
        }
        .btn-secondary {
            background-color: #4b5563;
            color: white;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Face Scanner</h2>
        <p class="subtitle">আপনার মুখমণ্ডল ফ্রেমে রেখে স্ক্যান করুন</p>

        <!-- ক্যামেরা এবং প্রিভিউ উইন্ডো -->
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="overlay" class="scan-overlay"></div>
            <p id="placeholderText" style="color: #6b7280; font-size: 14px;">ক্যামেরা চালু হয়নি</p>
        </div>

        <!-- নেভিগেশন ও অ্যাকশন বাটন -->
        <div class="btn-group">
            <button id="startCamBtn" class="btn-primary" onclick="startCamera()">ক্যামেরা চালু করুন</button>
            <button id="captureBtn" class="btn-success hidden" onclick="captureFace()">স্ক্যান ও ছবি ক্যাপচার</button>
            <button id="retakeBtn" class="btn-secondary hidden" onclick="resetCamera()">পুনরায় স্ক্যান করুন</button>
            <button id="submitBtn" class="btn-primary hidden" onclick="submitData()">ছবি সাবমিট করুন</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // টেলিগ্রাম মিনি অ্যাপ ফুলস্ক্রিন করা

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('overlay');
        const placeholderText = document.getElementById('placeholderText');

        const startCamBtn = document.getElementById('startCamBtn');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const submitBtn = document.getElementById('submitBtn');

        let stream = null;

        // ক্যামেরা চালু করার ফাংশন
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                placeholderText.classList.add('hidden');
                overlay.style.display = 'block';

                startCamBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
            } catch (err) {
                tg.showAlert("ক্যামেরা অ্যাক্সেস করা সম্ভব হয়নি! পারমিশন দিন।");
                console.error(err);
            }
        }

        // ফেস ক্যাপচার করার ফাংশন
        function captureFace() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;

            // ক্যানভাসে ফ্রেম ড্র করা
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // ভিডিও বন্ধ করে ক্যানভাস (প্রিভিউ) দেখানো
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.classList.add('hidden');
            overlay.style.display = 'none';
                canvas.classList.remove('hidden');

            captureBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');
            submitBtn.classList.remove('hidden');
        }

        // রিসেট বা পুনরায় স্ক্যান করার ফাংশন
        function resetCamera() {
            canvas.classList.add('hidden');
            video.classList.remove('hidden');
            retakeBtn.classList.add('hidden');
            submitBtn.classList.add('hidden');
            
            startCamera();
        }

        // ডাটা বা ছবি সাবমিট করার ফাংশন
        function submitData() {
            // ছবির বেজ৬৪ ডাটা পেতে canvas.toDataURL('image/jpeg') ব্যবহার করা যায়
            tg.showAlert("ছবি সফলভাবে প্রসেস করা হয়েছে!");
            tg.close(); // সাবমিট শেষে মিনি অ্যাপ বন্ধ করতে চাইলে
        }
    </script>
</body>
</html>
